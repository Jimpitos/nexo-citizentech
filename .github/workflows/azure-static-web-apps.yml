name: CI/CD NEXO - Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  # CI: instala dependências, valida o HTML e roda os testes.
  ci:
    name: CI (lint + testes)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar HTML (HTMLHint)
        run: npm run lint

      - name: Rodar testes
        run: npm test

  # CD: só roda se o CI passou. Publica no Azure Static Web Apps.
  # Em Pull Request cria um ambiente de pré-visualização; no push em main publica em produção.
  deploy:
    name: CD (deploy no Azure)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Publicar no Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src
          api_location: ""
          output_location: ""
          skip_app_build: true

  # Ao fechar/mergear o PR, remove o ambiente de pré-visualização.
  close_pull_request:
    name: Remover ambiente de preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Fechar ambiente do PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
