name: CI/CD NEXO - Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (lint + testes)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar HTML (HTMLHint)
        run: npm run lint

      - name: Rodar testes
        run: npm test

  deploy:
    name: CD (deploy no Azure)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar cliente OIDC
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Obter ID token do GitHub
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Publicar no Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_CLIFF_09AF9F00F }}
          action: "upload"
          app_location: "./src"
          api_location: ""
          output_location: "."
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request:
    name: Remover ambiente de preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Instalar cliente OIDC
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Obter ID token do GitHub
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Fechar ambiente do PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_CLIFF_09AF9F00F }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}